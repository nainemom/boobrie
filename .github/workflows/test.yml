name: Test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    env:
      RELAY_JWT_SECRET: test-only-insecure-secret
      RELAY_DB_URL: postgresql://user:password@localhost:5432/boobrie
      RELAY_PORT: 5200
      RELAY_HOST: 127.0.0.1
      RELAY_HEARTBEAT_MS: 2000
      RELAY_CHALLENGE_TTL_MS: 120000
      RELAY_SESSION_TTL_MS: 3600000
      CLIENT_RELAY_URL: http://localhost:5200
      CLIENT_PORT: 5100

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: boobrie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d boobrie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate-types

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Run tests
        run: npm run test
