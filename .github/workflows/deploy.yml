name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    # The push below carries a PAT, and unlike GITHUB_TOKEN a PAT push does
    # re-fire this workflow. Skip the run our own release commit caused, or
    # every release bumps forever.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    environment:
      name: production

    # The release commit does not exist when this run starts, so the deploy
    # jobs cannot reach it through `github.sha` — that is the commit *before*
    # the bump. They check out this sha instead.
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Git user
        run: |
          git config user.name "Amir Momenian"
          git config user.email "nainemom@gmail.com"

      - name: Bump Version
        id: bump
        run: |
          npx changelogen --clean --release --noAuthors --no-commit --no-tag --output CHANGELOG.md
          npm i --package-lock-only # hacky way to push package.json version into lock file
          npm run lint:fix # fix any formatting issues in package*.json
          git add --all
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          {
            echo "tag=v$VERSION"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Push
        id: push
        run: git push origin HEAD:${{ github.ref_name }} --tags

      - name: Report
        id: report
        run: |
          echo "Released ${{ steps.bump.outputs.tag }} as ${{ steps.bump.outputs.sha }}" \
            >> "$GITHUB_STEP_SUMMARY"

  deploy-client:
    name: Deploy Client
    runs-on: ubuntu-latest
    needs: bump-version

    environment:
      name: production
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      CLIENT_PUBLIC_URL: ${{ vars.CLIENT_PUBLIC_URL }}
      CLIENT_RELAY_URL: ${{ vars.CLIENT_RELAY_URL }}

    steps:
      # An empty ref makes checkout fall back to the commit that triggered the
      # run, which is the one before the bump. Fail loudly instead of shipping
      # the wrong build.
      - name: Require the release commit
        run: test -n "${{ needs.bump-version.outputs.sha }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate-types

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build:client

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  deploy-relay:
    name: Depoly Relay
    runs-on: ubuntu-latest
    needs: bump-version

    permissions:
      contents: read
      packages: write

    environment:
      name: production

    env:
      PAASTA_API_KEY: ${{ secrets.PAASTA_API_KEY }}

    steps:
      # An empty ref makes checkout fall back to the commit that triggered the
      # run, which is the one before the bump. Fail loudly instead of shipping
      # the wrong build.
      - name: Require the release commit
        run: test -n "${{ needs.bump-version.outputs.sha }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - name: Name the image
        id: image
        env:
          # Not GITHUB_SHA: that is the commit that triggered the run, one
          # before the release commit this job builds.
          SHA: ${{ needs.bump-version.outputs.sha }}
          TAG: ${{ needs.bump-version.outputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "ref=$IMAGE:${SHA::7}"
            echo "versioned=$IMAGE:$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.versioned }}
          # The variable is the only source for this: an unset one interpolates
          # to an empty string, and the build then fails at `EXPOSE` rather than
          # shipping an image that listens somewhere `--port` below is not.
          build-args: |
            RELAY_PORT=${{ vars.RELAY_PORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the Paasta CLI
        run: |
          curl -fsSL https://console.paasta.cloud/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in
        run: paasta login --api-key

      # `--port` because no source, and so no build config, reaches the platform
      # this way: the image is the whole deploy.
      - name: Deploy
        run: |
          paasta deploy \
            --image "${{ steps.image.outputs.ref }}" \
            --name "${{ vars.PAASTA_PROJECT_NAME }}" \
            --port "${{ vars.RELAY_PORT }}" \
            --billing payg \
            --yes

      - name: Report
        run: paasta status "${{ vars.PAASTA_PROJECT_NAME }}"
