name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: pages
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') }}
    runs-on: ubuntu-latest

    # Records the run under the repo's Environments tab and surfaces the live
    # URL on the job once Pages hands it back.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      CLIENT_PUBLIC_URL: ${{ vars.CLIENT_PUBLIC_URL }}
      CLIENT_RELAY_URL: ${{ vars.CLIENT_RELAY_URL }}
      RELAY_DB_URL: postgresql://unused:unused@localhost:5432/unused
      RELAY_JWT_SECRET: unused

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        run: npm run bump

      - name: Generate Prisma client
        run: npm run db:generate-types

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build:client

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Push the release commit
        run: git push origin HEAD:${{ github.ref_name }} --tags
