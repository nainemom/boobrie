name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write
  contents: write

jobs:
  bump-src-version:
    name: bump-src-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        run: |
          npx changelogen --clean --release --noAuthors --no-commit --no-tag --output CHANGELOG.md
          npm i --package-lock-only # hacky way to push package.json version into lock file
          npm run lint:fix # fix any formatting issues in package*.json
          git add --all
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"

      - name: Push
        id: push
        run: git push origin HEAD:${{ github.ref_name }} --tags

      - name: Report
        id: report
        run: node -p "require('./package.json').version"

  deploy-client:
    name: deploy-client
    runs-on: ubuntu-latest
    needs: bump-src-version

    environment:
      name: production
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      CLIENT_PUBLIC_URL: ${{ vars.CLIENT_PUBLIC_URL }}
      CLIENT_RELAY_URL: ${{ vars.CLIENT_RELAY_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate-types

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build:client

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  deploy-relay:
    name: deploy-relay
    runs-on: ubuntu-latest
    needs: bump-src-version

    permissions:
      contents: read
      packages: write

    environment:
      name: production

    env:
      PAASTA_API_KEY: ${{ secrets.PAASTA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Name the image
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          # The variable is the only source for this: an unset one interpolates
          # to an empty string, and the build then fails at `EXPOSE` rather than
          # shipping an image that listens somewhere `--port` below is not.
          build-args: |
            RELAY_PORT=${{ vars.RELAY_PORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the Paasta CLI
        run: |
          curl -fsSL https://console.paasta.cloud/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in
        run: paasta login --api-key

      # `--port` because no source, and so no build config, reaches the platform
      # this way: the image is the whole deploy.
      - name: Deploy
        run: |
          paasta deploy \
            --image "${{ steps.image.outputs.ref }}" \
            --name "${{ vars.PAASTA_PROJECT_NAME }}" \
            --port "${{ vars.RELAY_PORT }}" \
            --billing payg \
            --yes

      - name: Report
        run: paasta status "${{ vars.PAASTA_PROJECT_NAME }}"
