<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the app paint all the way to the physical
         edges of the screen and hands the notch and home-indicator sizes to CSS
         as `env(safe-area-inset-*)`, which `style.css` pads `#root` with.
         Without it those are all `0px` and the browser letterboxes the page
         itself, which on an installed PWA leaves a band of the wrong colour.

         `interactive-widget=resizes-content` is what stops the on-screen
         keyboard from shoving the layout out of the window: the layout viewport
         shrinks to the space above the keyboard, so `100dvh` keeps meaning "the
         part you can see" and the composer lands on top of it rather than
         behind it. iOS ignores the key, so `main.tsx` measures `visualViewport`
         and arrives at the same answer there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%CLIENT_PUBLIC_URL%/" />
    <!-- The font the UI is set in. Without this the browser can't discover it
         until the stylesheet has downloaded and parsed, which is one round trip
         too late; the preload starts it alongside the CSS instead. `crossorigin`
         is not optional even though the file is same-origin — fonts are always
         fetched in anonymous CORS mode, and a preload whose mode doesn't match
         is simply downloaded a second time. Only the sans face is listed: the
         mono one is used in a couple of small labels, and preloading it would
         compete with the font every visible word needs. -->
    <link
      rel="preload"
      href="/fonts/noto-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link href="/src/client/style.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
