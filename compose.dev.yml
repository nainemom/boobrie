# The local database, and nothing else: production runs against a managed one,
# so nothing here describes it. `npm run db:start` brings this up, and the tests
# and `npm run dev:relay` reach it at the address `.env` gives.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: boobrie
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d boobrie"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  db:
